name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend Testleri & Tip Denetimi
    runs-on: ubuntu-latest

    steps:
      - name: Kodu Klonla
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Python Kurulumu
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.lock.txt
            backend/requirements-dev.txt

      - name: Bağımlılıkları Kur
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.lock.txt
          pip install -r backend/requirements-dev.txt

      - name: Konfigürasyonu Hazırla
        run: |
          cp config.json.example config.json

      - name: Pytest Testlerini Çalıştır
        run: |
          python -m pytest

      - name: Mypy Statik Tip Kontrolü
        run: |
          mypy --strict backend/main.py backend/engine.py backend/auth.py backend/throttle.py backend/database.py backend/backup_manager.py backend/cve_analyzer.py backend/network_mapper.py backend/forensic_manager.py backend/telegram_manager.py backend/remediation_engine.py backend/honeypot.py backend/log_monitor.py backend/scheduler.py backend/schemas.py backend/compat.py backend/config.py backend/agent_auth.py backend/agent_client.py backend/migrate.py backend/tlsutil.py backend/serve.py backend/jobs.py backend/firewall.py backend/honeypot_services.py

  frontend-tests:
    name: Frontend Testleri & Derleme
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Kodu Klonla
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Node.js Kurulumu
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Node Bağımlılıklarını Kur
        run: |
          npm ci

      - name: Frontend Testlerini Çalıştır
        run: |
          CI=true npm test -- --watchAll=false

      - name: Üretim Derlemesi (Build)
        run: |
          CI=false npm run build

  security:
    name: Güvenlik Taraması
    runs-on: ubuntu-latest

    steps:
      - name: Kodu Klonla
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Python Kurulumu
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Araçları Kur
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Bandit
        run: |
          bandit -r backend light_agent -x backend/tests,backend/venv -ll

      - name: pip-audit
        run: |
          pip-audit -r backend/requirements.lock.txt

      - name: Node.js Kurulumu
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: npm audit
        continue-on-error: true
        working-directory: frontend
        run: |
          npm audit --audit-level=high

      - name: Gitleaks
        continue-on-error: true
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git --redact --no-banner .
